name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        run: npm run build -- --win nsis --x64

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/latest.yml
            dist/Moon-Tweaks-Setup-*.exe
            dist/Moon-Tweaks-Setup-*.exe.blockmap
